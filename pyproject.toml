[project]
name = "semif-qwen3-5-4b-twitter-eval"
version = "0.1.0"
description = "Live eval of Twitter sentiment with Qwen3.5-4B via SemIf API — FastAPI + SSE UI with confusion matrix, accuracy and per-class metrics vs original labels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "pydantic>=2.10",
]

[project.scripts]
twitter-eval = "twitter_eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twitter_eval"]
